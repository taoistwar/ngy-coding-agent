[package]
name = "coding-agent-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
embedded-web = ["dep:rust-embed"]
test-support = [
    "coding-agent-runtime/test-support",
    "coding-agent-store/test-support",
    "dep:sqlx",
]
e2e = ["embedded-web", "rust-embed/debug-embed", "test-support"]

[dependencies]
async-stream.workspace = true
async-trait.workspace = true
axum.workspace = true
axum-extra.workspace = true
base64.workspace = true
coding-agent-api = { path = "../coding-agent-api" }
coding-agent-core = { path = "../coding-agent-core" }
coding-agent-provider = { path = "../coding-agent-provider" }
coding-agent-runtime = { path = "../coding-agent-runtime" }
coding-agent-domain = { path = "../coding-agent-domain" }
coding-agent-store = { path = "../coding-agent-store" }
directories.workspace = true
futures-util.workspace = true
getrandom.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
mime_guess.workspace = true
rfd.workspace = true
rust-embed = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, optional = true }
subtle.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
webbrowser.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
coding-agent-store = { path = "../coding-agent-store", features = ["test-support"] }
sqlx.workspace = true
tempfile.workspace = true
